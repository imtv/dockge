# imtv-lite — 代理专用镜像（无 Web 面板，仅等主控连接）
# image 本身就是 agent，无需 DOCKGE_LITE 开关
#
# 主控: ghcr.io/imtv/dockge:imtv
# 代理: ghcr.io/imtv/dockge:imtv-lite
services:
  dockge-lite:
    image: ghcr.io/imtv/dockge:imtv-lite
    restart: unless-stopped
    ports:
      # 对主控开放；主控 Settings → Agents 添加 http://本机IP:5001
      - 5001:5001
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
      # 绝对路径，左右一致
      - /opt/stacks:/opt/stacks
    environment:
      - DOCKGE_STACKS_DIR=/opt/stacks
      # 主控添加代理时使用的账号（启动时写入/同步）
      - DOCKGE_USERNAME=agent
      - DOCKGE_PASSWORD=change-me-now
      # 显示名（不是 HTTP 监听地址）
      - DOCKGE_AGENT_NAME=node-2
