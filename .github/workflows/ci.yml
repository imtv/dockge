# Upstream Dockge CI — fixed for this fork.
# Invalid upstream step (run + uses together) and missing ARM runners caused
# a failed "ci.yml" run on every push. We only need ubuntu CI on master;
# image builds for imtv are handled by ghcr-build.yml.
name: Node.js CI - Dockge

on:
  push:
    branches: [master]
    paths-ignore:
      - "*.md"
      - "IMTV.md"
  pull_request:
    branches: [master]
    paths-ignore:
      - "*.md"
      - "IMTV.md"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure git line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm clean-install --no-fund --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Check Typescript
        run: npm run check-ts

      - name: Build
        run: npm run build:frontend
